plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'jacoco'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    runs {
        gametest {
            client()
            property 'fabric.client.gametest', 'true'
            property 'fabric.client.gametest.modid', 'gambling'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Standalone resource pack zip: served to vanilla clients through
// server.properties resource-pack so the casino table has real textures.
tasks.register('resourcesZip', Zip) {
    archiveFileName = "${project.archives_base_name}-resources-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('src/main/resources') {
        include 'assets/**'
        include 'pack.mcmeta'
    }
}

assemble.dependsOn tasks.named('resourcesZip')

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
